<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">HB2504 faculty profile cropping illustration with a fixed 1:1 ratio</title>
  <desc id="desc">An anonymous avatar inside an adjustable square crop with a fixed 1:1 aspect ratio and a square preview. The tool creates uniform faculty profile image dimensions for HB2504 department listings. This is an interface illustration, not an application screenshot.</desc>
  <style>:root{--primary:#211f20;--secondary:#e3dac7;--accent:#c56d3f;--surface:#2a2728;--surface-accent:#352e2b;--avatar:#9a583b;--line:#51463f}text{font-family:'DM Sans',Arial,sans-serif;fill:var(--secondary)}.small{font-size:24px}.label{font-size:26px;font-weight:600}</style>
  <defs><clipPath id="photo"><rect x="107" y="174" width="604" height="457" rx="18"/></clipPath><clipPath id="preview"><rect x="823" y="244" width="222" height="222" rx="4"/></clipPath></defs>
  <rect width="1200" height="750" rx="30" fill="var(--primary)"/>
  <rect x="65" y="57" width="1080" height="650" rx="30" fill="#171516" opacity=".35"/>
  <rect x="55" y="42" width="1090" height="650" rx="30" fill="var(--surface)"/>
  <text x="107" y="119" style="font-size:33px;font-weight:600">HB2504 · Faculty profile crop</text>
  <circle cx="1084" cy="105" r="22" fill="var(--primary)"/>
  <path d="m1076 97 16 16m0-16-16 16" stroke="var(--secondary)" stroke-width="3" stroke-linecap="round"/>
  <g clip-path="url(#photo)">
    <rect x="107" y="174" width="604" height="457" fill="var(--accent)" opacity=".3"/>
    <path d="M155 675c0-150 103-236 254-236s254 86 254 236" fill="var(--avatar)"/>
    <ellipse cx="409" cy="336" rx="94" ry="109" fill="var(--avatar)"/>
    <rect x="107" y="174" width="604" height="457" fill="var(--secondary)" opacity=".12"/>
  </g>
  <rect x="238" y="204" width="342" height="342" rx="2" fill="none" stroke="var(--secondary)" stroke-width="5"/>
  <g stroke="var(--secondary)" stroke-width="2" opacity=".7"><path d="M352 204v342m114-342v342M238 318h342M238 432h342"/></g>
  <g fill="var(--secondary)" stroke="var(--primary)" stroke-width="2"><rect x="230" y="196" width="17" height="17" rx="3"/><rect x="572" y="196" width="17" height="17" rx="3"/><rect x="230" y="538" width="17" height="17" rx="3"/><rect x="572" y="538" width="17" height="17" rx="3"/></g>
  <text x="934" y="205" text-anchor="middle" class="label">Fixed 1:1 preview</text>
  <g clip-path="url(#preview)"><rect x="823" y="244" width="222" height="222" rx="4" fill="var(--primary)"/><path d="M808 479c0-90 51-140 126-140s126 50 126 140" fill="var(--avatar)"/><ellipse cx="934" cy="298" rx="47" ry="55" fill="var(--avatar)"/></g>
  <rect x="822" y="243" width="224" height="224" rx="4" fill="none" stroke="var(--secondary)" stroke-opacity=".2" stroke-width="3"/>
  <text x="934" y="519" text-anchor="middle" style="font-size:22px">Uniform profile dimensions.</text>
  <rect x="781" y="563" width="124" height="62" rx="31" fill="var(--primary)"/>
  <text x="843" y="603" text-anchor="middle" class="small">Reset</text>
  <rect x="924" y="563" width="167" height="62" rx="31" fill="var(--accent)"/>
  <text x="1007" y="603" text-anchor="middle" style="font-size:24px;fill:var(--primary);font-weight:600">Use photo</text>
</svg>
